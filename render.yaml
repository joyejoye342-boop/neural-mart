services:
  - type: web
    name: neuralmart
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/neuralmart build && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: neuralmart-db
          property: connectionString

databases:
  - name: neuralmart-db
    databaseName: neuralmart
    user: neuralmart
    plan: free
